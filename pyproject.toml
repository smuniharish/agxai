[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "agxai"
version = "1.0.2"
description = "A provider-neutral, framework-agnostic explainability layer for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "S MUNI HARISH", email = "samamuniharish@gmail.com" },
]
keywords = [
  "langgraph",
  "langchain",
  "agents",
  "agno",
  "crewai",
  "explainability",
  "explainable-ai",
  "xai",
  "provenance",
  "audit",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.14.3,<3",
]

[project.optional-dependencies]
langgraph = [
  "langchain-core>=1.7.6,<2",
  "langgraph>=1.2.20,<2",
]
langsmith = ["langsmith>=0.14.17,<1"]
langfuse = ["langfuse>=5.2.0,<6"]
otel = [
  "opentelemetry-api>=1.45.2,<2",
  "opentelemetry-sdk>=1.45.2,<2",
]
llm-openai = ["langchain-openai>=1.7.4,<2"]
all = ["agxai[langgraph,langfuse,langsmith,llm-openai,otel]"]

[project.urls]
Homepage = "https://github.com/smuniharish/agxai"
Documentation = "https://agxai.readthedocs.io/"
Changelog = "https://github.com/smuniharish/agxai/blob/master/CHANGELOG.md"
Issues = "https://github.com/smuniharish/agxai/issues"
Repository = "https://github.com/smuniharish/agxai"

[dependency-groups]
test = [
  "hypothesis>=6.170.14",
  "langchain>=1.4.9,<2",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "skills-ref>=0.1.1,<1",
]
lint = ["ruff>=0.17.3"]
types = ["pyrefly>=1.4.1"]
docs = [
  "griffe-pydantic>=1.3.2,<2",
  "mkdocstrings-python>=2.0.10,<3",
  "zensical>=0.1.0,<0.2",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "types" },
]
examples = [
  "deepagents>=0.7.32,<1",
  "langchain>=1.4.9,<2",
  "langchain-mcp-adapters>=0.3.2,<1",
  "psycopg[binary,pool]>=3.3.8,<4",
  "psycopg-pool>=3.3.3,<4",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # langsmith 0.14.17 calls asyncio.iscoroutinefunction at import time (deprecated in 3.14).
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
markers = [
  "live: tests requiring explicitly configured external services",
  "postgres: tests requiring XAI_TEST_POSTGRES_DSN",
  "benchmark: performance regression tests",
  "examples: tests that execute the scripts under examples/",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "UP",
  "W",
]
# Google style documents constructor arguments on the class, not on __init__.
ignore = ["D105", "D107", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring and unused-argument rules apply to the package; examples, scripts, and
# tests implement LangGraph nodes, tools, and retrievers whose signatures are fixed.
"examples/**/*.py" = ["ARG", "D", "T201"]
"scripts/**/*.py" = ["ARG", "D", "T201"]
"tests/**/*.py" = ["A002", "ARG", "D", "S101", "S105", "S106", "S108"]
"agxai-skills/**/scripts/*.py" = ["ARG", "D", "T201"]
"agxai-skills/**/assets/*.py" = ["ARG", "D"]
"agxai-skills/**/evals/files/**/*.py" = ["ARG", "D", "T201"]
"src/agxai/integrations/langgraph/graph.py" = ["A002"]
# LangChain calls the handlers with its full callback signatures.
"src/agxai/integrations/langgraph/callbacks.py" = ["ARG002"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["src", "tests", "examples", "scripts", "agxai-skills"]
search-path = ["src", ".", "examples", "agxai-skills/skills/agxai-extend/assets"]

# LangGraph bounds StateGraph's state type with protocols that pyrefly does not yet
# match against TypedDict classes; the package itself never specializes StateGraph.
[[tool.pyrefly.sub-config]]
matches = "examples/**"
errors = { bad-specialization = false }

[[tool.pyrefly.sub-config]]
matches = "tests/**"
errors = { bad-specialization = false }

[[tool.pyrefly.sub-config]]
matches = "agxai-skills/**"
errors = { bad-specialization = false }

[tool.coverage.run]
branch = true
source = ["agxai"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
]
